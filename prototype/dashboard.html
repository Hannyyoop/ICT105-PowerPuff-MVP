<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

<nav>

    <h2>Room Booking System</h2>

    <ul class="nav-links">

        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="booking-request.html">Booking Requests</a></li>
        <li><a href="admin.html">Manage Rooms</a></li>


    </ul>

</nav>

<div class="dashboard-container">

    <h1 class="dashboard-title">
        Dashboard
    </h1>

    <p class="dashboard-subtitle">
        Booking summary and room statistics.
    </p>

<div class="dashboard-cards">

    <div class="dashboard-card">

        <h2>Total Rooms</h2>

        <span class="dashboard-number" id="totalRooms">
            0
        </span>

    </div>


    <div class="dashboard-card">

        <h2>Total Bookings</h2>

        <span class="dashboard-number" id="totalBookings">
            0
        </span>

    </div>


    <div class="dashboard-card">

        <h2>Available Rooms</h2>

        <span class="dashboard-number" id="availableRooms">
            0
        </span>

    </div>


    <div class="dashboard-card">

        <h2>Pending Bookings</h2>

        <span class="dashboard-number" id="pendingBookings">
            0
        </span>

    </div>

</div>

    <h2 class="recent-title">
        Recent Bookings
    </h2>

<table class="dashboard-table">

    <thead>

        <tr>
            <th>Room</th>
            <th>Student</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
        </tr>

    </thead>

    <tbody id="recentBookingsTableBody">
    </tbody>

</table>

</div>

<script src="script.js"></script>

</body>
</html>
